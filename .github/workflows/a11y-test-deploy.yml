name: Accessibility Test and Deploy

on:
  push:
    branches: [ primary ]
  pull_request:
    branches: [ primary ]
  workflow_dispatch:

jobs:
  a11y-test-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm install
      
      - name: Build site
        run: npm run build
      
      - name: Install Puppeteer dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgbm-dev
      
      - name: Run accessibility tests
        id: a11y-test
        run: |
          # Create a server to host the build files
          npx http-server ./build -p 8080 &
          SERVER_PID=$!
          
          # Wait for server to start
          sleep 5
          
          # Run axe and save output to a file
          npx @axe-core/cli http://localhost:8080 --tags wcag2a,wcag2aa --exit --impact=serious,critical > axe-results.txt || true
          
          # Check if there are any serious or critical issues
          if grep -q "critical\|serious" axe-results.txt; then
            echo "Accessibility tests failed with serious or critical issues"
            cat axe-results.txt
            kill $SERVER_PID
            exit 1
          else
            echo "No serious or critical accessibility issues found"
            kill $SERVER_PID
            exit 0
          fi
      
      - name: Deploy to GitHub Pages
        if: success()
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: build
          branch: gh-pages 